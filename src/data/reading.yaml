# Blogs and articles worth passing on. Newest first.
#
# Fields:
#   title        The headline, as written.
#   source       Publication or company only — no author name. It renders
#                inline, right after the title, so keep it short.
#   url          Canonical link.
#   tags         Drives the filter chips on /all-reading/. Lowercase, single
#                words — they render uppercase, and long kebab tags go ragged.
#                Current vocabulary: agents, culture, data, security, tooling.
#                Add a new one only when a second entry would also use it; the
#                chip row is the union of these, built at build time.
#   highlighted  true also surfaces the entry in the Reading section on the
#                homepage. No cap — every highlighted entry appears there.
#   note         One line on why it stuck. Shown on /all-reading/ only.
#
# To add one, copy this block to the top:
#
#   - title: The headline, as written
#     source: Publication
#     url: https://...
#     tags: [agents]
#     highlighted: false
#     note: One line on why it stuck with you.

